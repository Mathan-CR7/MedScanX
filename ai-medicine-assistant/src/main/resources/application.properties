spring.application.name=ai-medicine-assistant
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medicine_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Redis Cache Settings
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
# Enable scheduled execution
spring.task.scheduling.pool.size=5
# Medicine Identification Pipeline Settings (Configurable Thresholds & Weights)
medicine.verification.verified-threshold=0.75
medicine.verification.review-threshold=0.50
medicine.verification.brand-weight=0.40
medicine.verification.composition-weight=0.30
medicine.verification.manufacturer-weight=0.15
medicine.verification.strength-weight=0.15
# Spring AI — Google Gemini (AI Studio) Configuration
# Get your free API key at: https://aistudio.google.com/app/apikey
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
# Temperature: 0.0 = deterministic (best for factual medicine identification)
spring.ai.google.genai.chat.options.temperature=0.0
# Telegram Bot Integration
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=medicine_label_ai_bot
telegram.bot.enabled=true




