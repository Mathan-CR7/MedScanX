spring.application.name=ai-medicine-assistant-test

# Use H2 in-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Use simple local caching instead of Redis during tests
spring.cache.type=simple

# Gemini dummy key — used by SpringAiConfig during tests
spring.ai.google.genai.api-key=test-dummy-gemini-key-12345
spring.ai.google.genai.chat.options.model=gemini-2.0-flash

# Disable Redis for tests — spring.cache.type=simple uses in-memory cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
